spring.application.name=challengesphere
app.persistence.mode=${APP_PERSISTENCE_MODE:dynamodb}
app.dynamodb.enabled=${DYNAMODB_ENABLED:true}
app.dynamodb.region=${AWS_REGION:us-east-1}
app.dynamodb.endpoint=${DYNAMODB_ENDPOINT:http://localhost:8000}
app.dynamodb.main-table=${DYNAMODB_MAIN_TABLE_NAME:challengesphere-main}
app.dynamodb.ephemeral-table=${DYNAMODB_EPHEMERAL_TABLE_NAME:challengesphere-ephemeral}
app.dynamodb.cursor-secret=${DYNAMODB_CURSOR_SECRET:challengesphere-local-cursor-secret-change-me-32-bytes}
app.dynamodb.cursor-max-age=${DYNAMODB_CURSOR_MAX_AGE:24h}
#logging.level.org.springframework.security=DEBUG
# Server configuration
server.port=8080
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# JWT Configuration
jwt.secret=${JWT_SECRET:challengesphere-local-dev-secret-change-me-please-256-bits-long}
jwt.access-token.expiration=${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
jwt.refresh-token.expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# Security configurations
#app.auth.tokenSecret=AtLeastThirtyTwoCharactersLongSecureKeyForJWT
#app.auth.tokenExpirationMsec=864000000
#app.auth.issuer=challengesphere.com
#app.auth.audience=challengesphere-api

# CORS configurations
#app.cors.allowedOrigins=https://challengesphere.com
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8080

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Enable Swagger/OpenAPI
springdoc.show-actuator=true
springdoc.swagger-ui.disable-swagger-default-url=true
# OAuth2 authorized redirect URIs
#app.oauth2.authorizedRedirectUris=https://challengesphere.com/oauth2/redirect

# HTTP security headers
server.forward-headers-strategy=NATIVE

# TLS configuration - enable in production
# server.ssl.enabled=true
# server.ssl.key-store-type=PKCS12
# server.ssl.key-store=classpath:keystore/athletiverse.p12
# server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD}
# server.ssl.key-alias=athletiverse
