################################## DB CONNECTION ###########################################################
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/mihirdalal}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.properties.hibernate.default_schema=challengesphere
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.show-sql=true
spring.jpa.open-in-view=false

logging.config=classpath:log4j2.properties

# HikariCP connection pool
spring.datasource.hikari.pool-name=ChallengeSphereLocalPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:30}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.keepalive-time=${DB_POOL_KEEPALIVE_TIME_MS:120000}

################################## TWILIO CONFIG ##########################################################
twilio.verifyServiceSid=${TWILIO_VERIFY_SERVICE_SID:}
twilio.accountSid=${TWILIO_ACCOUNT_SID:}
twilio.authToken=${TWILIO_AUTH_TOKEN:}
################################## CHALLENGE CONFIG ######################################################
app.challenge.free-max-active-per-visibility=${FREE_MAX_ACTIVE_CHALLENGES_PER_VISIBILITY:5}
app.challenge.premium-max-active-per-visibility=${PREMIUM_MAX_ACTIVE_CHALLENGES_PER_VISIBILITY:20}

################################## SMTP CONFIG ###########################################################
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=
spring.mail.password-parameter-name=${MAIL_PASSWORD_PARAMETER_NAME:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.frontend.base-url=http://localhost:3000

# Twilio (disabled locally by default; set twilio.enabled=true to exercise real send)
twilio.enabled=false

# Notification digest (disabled locally)
app.notifications.digest.enabled=false
app.notifications.digest.cron=0 0 9 * * *
app.notifications.digest.max-notifications=25

# Push notifications
app.push.expo.enabled=${APP_PUSH_EXPO_ENABLED:true}
app.push.expo.url=${APP_PUSH_EXPO_URL:https://exp.host/--/api/v2/push/send}
app.push.daily-reminder.enabled=${APP_PUSH_DAILY_REMINDER_ENABLED:true}
app.push.daily-reminder.cron=${APP_PUSH_DAILY_REMINDER_CRON:0 */15 * * * *}
#################### AWS S3 + Rekognition #####################
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:challengesphere-submissions-1}
aws.rekognition.min-confidence=${AWS_REKOGNITION_MIN_CONFIDENCE:70}
aws.rekognition.likely-confidence=${AWS_REKOGNITION_LIKELY_CONFIDENCE:80}
aws.rekognition.very-likely-confidence=${AWS_REKOGNITION_VERY_LIKELY_CONFIDENCE:90}
################### Local or ElastiCache-compatible Redis #########################
spring.data.redis.repositories.enabled=false
spring.redis.host=localhost
spring.redis.timeout=${REDIS_TIMEOUT_MS:2000}
spring.redis.ssl=false
spring.redis.port=6379
spring.redis.password=
spring.redis.database=0

# Redis Connection Pool Configuration (Jedis)
spring.redis.jedis.pool.max-active=8
spring.redis.jedis.pool.max-idle=8
spring.redis.jedis.pool.min-idle=0
spring.redis.jedis.pool.max-wait=${REDIS_POOL_MAX_WAIT_MS:1000}

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000

# Invite Link Configuration
app.invite.base-url=https://challengesphere.com/invite

management.health.redis.enabled=false

# Google OAuth
# Audiences must match the Google clients used by the frontend.
# Android uses the web client id; iOS uses the iOS client id.
google.client.id=${GOOGLE_CLIENT_ID:745252519059-ednontpssnid8aqer2f9s3v6aat8bl6d.apps.googleusercontent.com,745252519059-pm0s0sqb557b38iafdrg787uilc21sle.apps.googleusercontent.com,745252519059-vd2h1mf7tv74litocl6d5esid16ng6kt.apps.googleusercontent.com,745252519059-v583n1i3vg5ele9qito38ds6galebtfq.apps.googleusercontent.com}
google.signin.enabled=${GOOGLE_SIGNIN_ENABLED:true}
