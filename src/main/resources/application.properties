spring.application.name=challengesphere
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# DB - defaults to PostgreSQL (H2 removed from dependencies)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=challengesphere
spring.jpa.open-in-view=false
# Keep cache safe for local development when Redis is unavailable.
spring.cache.type=simple
spring.data.redis.repositories.enabled=false
spring.redis.password-parameter-name=${REDIS_PASSWORD_PARAMETER_NAME:}

server.port=${PORT:8080}

jwt.secret=${JWT_SECRET:challengesphere-local-dev-secret-change-me-please-256-bits-long}
jwt.access-token.expiration=${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
jwt.refresh-token.expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# API docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
app.security.public-docs-enabled=${PUBLIC_DOCS_ENABLED:true}

# Local frontend origins (override per environment as needed)
app.cors.allowed-origins=https://challengesphere.com,http://localhost:3000,http://localhost:5173,http://localhost:8080

# AWS media storage and moderation.
# Credentials are resolved through the AWS default provider chain:
# environment variables, system properties, profile files, ECS/EKS/EC2 role, etc.
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:local-submissions}
aws.rekognition.min-confidence=${AWS_REKOGNITION_MIN_CONFIDENCE:70}
aws.rekognition.likely-confidence=${AWS_REKOGNITION_LIKELY_CONFIDENCE:80}
aws.rekognition.very-likely-confidence=${AWS_REKOGNITION_VERY_LIKELY_CONFIDENCE:90}
app.moderation.submission-sweep.enabled=${APP_MODERATION_SUBMISSION_SWEEP_ENABLED:true}
app.moderation.submission-sweep.cron=${APP_MODERATION_SUBMISSION_SWEEP_CRON:0 */2 * * * *}
app.moderation.submission-sweep.batch-size=${APP_MODERATION_SUBMISSION_SWEEP_BATCH_SIZE:100}

management.health.redis.enabled=false

# Invite Link Configuration
app.invite.base-url=https://challengesphere.com/invite

# Challenge participation policy
app.challenge.max-active-participations=${MAX_ACTIVE_CHALLENGE_PARTICIPATIONS:0}

# Frontend base URL (used in email links)
app.frontend.base-url=https://challengesphere.com

# Mail (SMTP) — production password is read from an encrypted SSM parameter.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=
spring.mail.password-parameter-name=${MAIL_PASSWORD_PARAMETER_NAME:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.enabled=${APP_MAIL_ENABLED:false}

# Thymeleaf (email templates optional — HTML built inline by EmailServiceImpl)
spring.thymeleaf.check-template-location=false

# Notification digest
app.notifications.digest.enabled=false
app.notifications.digest.cron=0 0 9 * * *
app.notifications.digest.max-notifications=25

# Push notifications
app.push.expo.enabled=${APP_PUSH_EXPO_ENABLED:true}
app.push.expo.url=${APP_PUSH_EXPO_URL:https://exp.host/--/api/v2/push/send}
app.push.daily-reminder.enabled=${APP_PUSH_DAILY_REMINDER_ENABLED:true}
app.push.daily-reminder.cron=${APP_PUSH_DAILY_REMINDER_CRON:0 */15 * * * *}

# Twilio Verify (SMS OTP)
twilio.accountSid=${TWILIO_ACCOUNT_SID:}
twilio.authToken=${TWILIO_AUTH_TOKEN:}
twilio.verifyServiceSid=${TWILIO_VERIFY_SERVICE_SID:}
twilio.enabled=false

# Google OAuth audiences used by native sign-in.
# Android uses the web client id; iOS uses the iOS client id.
google.client.id=${GOOGLE_CLIENT_ID:745252519059-ednontpssnid8aqer2f9s3v6aat8bl6d.apps.googleusercontent.com,745252519059-pm0s0sqb557b38iafdrg787uilc21sle.apps.googleusercontent.com,745252519059-vd2h1mf7tv74litocl6d5esid16ng6kt.apps.googleusercontent.com,745252519059-v583n1i3vg5ele9qito38ds6galebtfq.apps.googleusercontent.com}
google.signin.enabled=${GOOGLE_SIGNIN_ENABLED:true}
