spring.application.name=challengesphere
app.persistence.mode=dynamodb
app.dynamodb.enabled=true
app.dynamodb.region=${AWS_REGION:ap-south-1}
app.dynamodb.main-table=${DYNAMODB_MAIN_TABLE_NAME:challengesphere-main}
app.dynamodb.ephemeral-table=${DYNAMODB_EPHEMERAL_TABLE_NAME:challengesphere-ephemeral}
app.dynamodb.cursor-secret=${DYNAMODB_CURSOR_SECRET}
app.dynamodb.cursor-max-age=${DYNAMODB_CURSOR_MAX_AGE:24h}
#logging.level.org.springframework.security=DEBUG
# Server configuration
server.port=8080
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# JWT Configuration
jwt.secret=${JWT_SECRET:}
jwt.secret-parameter-name=${JWT_SECRET_PARAMETER_NAME:/challengesphere/prod/jwt-signing-secret}
jwt.access-token.expiration=${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
jwt.refresh-token.expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# Security configurations
#app.auth.tokenSecret=AtLeastThirtyTwoCharactersLongSecureKeyForJWT
#app.auth.tokenExpirationMsec=864000000
#app.auth.issuer=challengesphere.com
#app.auth.audience=challengesphere-api

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}

# Enable Swagger/OpenAPI only by explicit production opt-in
springdoc.show-actuator=${SPRINGDOC_SHOW_ACTUATOR:false}
springdoc.swagger-ui.disable-swagger-default-url=true
app.security.public-docs-enabled=${PUBLIC_DOCS_ENABLED:false}
# OAuth2 authorized redirect URIs
#app.oauth2.authorizedRedirectUris=https://challengesphere.com/oauth2/redirect

# HTTP security headers
server.forward-headers-strategy=NATIVE
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://challengesphere.com}
app.security.trusted-proxy-cidrs=${TRUSTED_PROXY_CIDRS:}

# TLS configuration - enable in production
