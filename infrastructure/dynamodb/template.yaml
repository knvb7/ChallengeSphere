  BackupJobFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateScheduledBackups
    Properties:
      AlarmDescription: At least one DynamoDB AWS Backup job failed.
      Namespace: AWS/Backup
      MetricName: NumberOfBackupJobsFailed
      Dimensions:
        - Name: BackupVaultName
          Value: !Ref BackupVault
        - Name: ResourceType
          Value: DynamoDB
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmNotificationTopic
        - - !Ref AlarmNotificationTopicArn
        - !Ref AWS::NoValue

Outputs:
  MainTableName:
    Description: Durable single-table data store name.
    Value: !Ref MainTable
  MainTableArn:
    Description: Durable single-table data store ARN.
    Value: !GetAtt MainTable.Arn
  MainTableStreamArn:
    Description: NEW_AND_OLD_IMAGES stream ARN for materialized-view consumers.
    Value: !GetAtt MainTable.StreamArn
  EphemeralTableName:
    Description: TTL-backed token, quota, idempotency, and job-claim table name.
    Value: !Ref EphemeralTable
  EphemeralTableArn:
    Description: Ephemeral table ARN.
    Value: !GetAtt EphemeralTable.Arn
  EphemeralTableStreamArn:
    Description: NEW_IMAGE ephemeral stream ARN.
    Value: !GetAtt EphemeralTable.StreamArn
  RuntimeManagedPolicyArn:
    Description: Least-privilege table/index data-plane policy ARN. Scan is intentionally denied by omission.
    Value: !Ref RuntimeDataPlanePolicy
  RuntimeRoleName:
    Description: Existing role receiving the policy, or UNATTACHED when BackendRuntimeRoleName is blank.
    Value: !If [AttachRuntimePolicy, !Ref BackendRuntimeRoleName, UNATTACHED]
  RuntimeRoleArn:
    Description: Existing role ARN receiving the policy, or UNATTACHED.
    Value: !If
      - AttachRuntimePolicy
      - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${BackendRuntimeRoleName}'
      - UNATTACHED
  StreamConsumerManagedPolicyArn:
    Description: Unattached least-privilege policy for future real stream consumers.
    Value: !Ref StreamConsumerPolicy
  BackupVaultName:
    Condition: CreateScheduledBackups
    Description: Retained AWS Backup vault containing daily recovery points.
    Value: !Ref BackupVault
  BackupPlanId:
    Condition: CreateScheduledBackups
    Description: Daily exact-resource AWS Backup plan ID.
    Value: !Ref DailyBackupPlan
