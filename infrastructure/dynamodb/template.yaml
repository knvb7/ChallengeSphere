        - !Ref AWS::NoValue
      Metrics:
        - {Id: total, Label: Main total consumed read request units, Expression: 'm0+m1+m2+m3+m4+m5+m6', ReturnData: true}
        - Id: m0
          ReturnData: false
          MetricStat: {Period: 300, Stat: Sum, Metric: {Namespace: AWS/DynamoDB, MetricName: ConsumedReadCapacityUnits, Dimensions: [{Name: TableName, Value: !Ref MainTable}]}}
        - Id: m1
          ReturnData: false
          MetricStat: {Period: 300, Stat: Sum, Metric: {Namespace: AWS/DynamoDB, MetricName: ConsumedReadCapacityUnits, Dimensions: [{Name: TableName, Value: !Ref MainTable}, {Name: GlobalSecondaryIndexName, Value: GSI1}]}}
